<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="light">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div class="greeting-block">
        <h1 id="greeting">Good Morning!</h1>
        <p id="date-display"></p>
        <p id="time-display"></p>
      </div>
      <!-- Challenge 2: Custom Name -->
      <div class="name-block">
        <input
          type="text"
          id="name-input"
          placeholder="Enter your name…"
          maxlength="30"
          aria-label="Your name"
        />
        <button id="save-name-btn" class="btn btn-small">Save</button>
      </div>
    </div>
    <!-- Challenge 1: Theme Toggle -->
    <button id="theme-toggle-btn" class="btn btn-icon" aria-label="Toggle theme" title="Toggle light / dark mode">
      🌙
    </button>
  </header>

  <!-- ===== MAIN DASHBOARD ===== -->
  <main class="dashboard">

    <!-- ===== TO-DO LIST ===== -->
    <section class="card" id="todo-section" aria-label="To-Do List">
      <h2 class="card-title">📝 To-Do List</h2>

      <div class="input-row">
        <input
          type="text"
          id="task-input"
          placeholder="Add a new task…"
          maxlength="120"
          aria-label="New task"
        />
        <button id="add-task-btn" class="btn btn-primary">Add</button>
      </div>

      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

      <p class="empty-msg" id="todo-empty">No tasks yet. Add one above!</p>
    </section>

    <!-- ===== POMODORO TIMER ===== -->
    <section class="card" id="timer-section" aria-label="Pomodoro Timer">
      <h2 class="card-title">⏱ Focus Timer</h2>

      <!-- Challenge 3: Duration Selector -->
      <div class="duration-row">
        <label for="duration-select" class="label-small">Duration:</label>
        <select id="duration-select" aria-label="Pomodoro duration">
          <option value="15">15 min</option>
          <option value="25" selected>25 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
        </select>
      </div>

      <div class="timer-display" aria-live="polite" aria-label="Timer">
        <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
      </div>

      <div class="timer-controls">
        <button id="start-timer-btn" class="btn btn-primary">Start</button>
        <button id="stop-timer-btn" class="btn btn-secondary">Stop</button>
        <button id="reset-timer-btn" class="btn btn-ghost">Reset</button>
      </div>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card" id="links-section" aria-label="Quick Links">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="input-row">
        <input
          type="text"
          id="link-label-input"
          placeholder="Label (e.g. GitHub)"
          maxlength="40"
          aria-label="Link label"
        />
        <input
          type="url"
          id="link-url-input"
          placeholder="https://…"
          maxlength="300"
          aria-label="Link URL"
        />
        <button id="add-link-btn" class="btn btn-primary">Add</button>
      </div>

      <ul id="link-list" class="link-list" aria-label="Quick links"></ul>

      <p class="empty-msg" id="links-empty">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Edit task" hidden>
    <div class="modal">
      <h3>Edit Task</h3>
      <input type="text" id="edit-task-input" maxlength="120" aria-label="Edit task text" />
      <div class="modal-actions">
        <button id="save-edit-btn" class="btn btn-primary">Save</button>
        <button id="cancel-edit-btn" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
